name: UAT-pipeline

on:
  push:
    branches:
      - UAT
  workflow_dispatch:

concurrency:
  group: UAT-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - quikit
          - auth
          - admin
          - quikscale
          - quiktrack
          - quikhrms
          - quikinfra
          - quikcrm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.app }}-runtime
          tags: |
            type=raw,value=build-${{ github.run_number }}
            type=sha,prefix=sha-,format=short
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          platforms: linux/amd64

          build-args: |
            NEXT_PUBLIC_LAUNCHER_URL=https://uatapps.quikit.ai
            NEXT_PUBLIC_AUTH_URL=https://uatauthn.quikit.ai
            NEXT_PUBLIC_QUIKIT_URL=https://uatapps.quikit.ai
            NEXT_PUBLIC_QUIKSCALE_URL=https://uatscale.quikit.ai
            NEXT_PUBLIC_ADMIN_URL=https://uatorgadmin.quikit.ai
            NEXT_PUBLIC_LOGIN_URL=https://uatauthn.quikit.ai/login
            NEXT_PUBLIC_QUIKINFRA_URL=https://uatinfra.quikit.ai
            NEXT_PUBLIC_QUIKCRM_URL=https://uatcrm.quikit.ai
            NEXTAUTH_URL=https://uatauthn.quikit.ai
