name: UAT-pipeline

on:
  push:
    branches:
      - UAT
  workflow_dispatch:
concurrency:
  group: UAT-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest

outputs:
  apps: ${{ steps.set-matrix.outputs.apps }}
  run_build: ${{ steps.set-matrix.outputs.run_build }}

steps:
  - name: Checkout
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Detect changes in apps and packages
    id: filter
    uses: dorny/paths-filter@v3
    with:
      filters: |
        quikit:
          - 'apps/quikit/**'
          - 'packages/**'
          - 'package.json'
          - 'package-lock.json'
          - 'turbo.json'

        auth:
          - 'apps/auth/**'
          - 'packages/**'
          - 'package.json'
          - 'package-lock.json'
          - 'turbo.json'

        admin:
          - 'apps/admin/**'
          - 'packages/**'
          - 'package.json'
          - 'package-lock.json'
          - 'turbo.json'

        quikscale:
          - 'apps/quikscale/**'
          - 'packages/**'
          - 'package.json'
          - 'package-lock.json'
          - 'turbo.json'

        quiktrack:
          - 'apps/quiktrack/**'
          - 'packages/**'
          - 'package.json'
          - 'package-lock.json'
          - 'turbo.json'

        quikinfra:
          - 'apps/quikinfra/**'
          - 'packages/**'
          - 'package.json'
          - 'package-lock.json'
          - 'turbo.json'

        quikcrm:
          - 'apps/quikcrm/**'
          - 'packages/**'
          - 'package.json'
          - 'package-lock.json'
          - 'turbo.json'

        quikhrms:
          - 'apps/quikhrms/**'
          - 'packages/**'
          - 'package.json'
          - 'package-lock.json'
          - 'turbo.json'

  - name: Generate Matrix Output
    id: set-matrix
    shell: bash
    run: |
      if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
        echo 'apps=["quikit","auth","admin","quikscale","quiktrack","quikhrms","quikinfra","quikcrm"]' >> "$GITHUB_OUTPUT"
        echo "run_build=true" >> "$GITHUB_OUTPUT"
        exit 0
      fi

      APPS=()

      [ "${{ steps.filter.outputs.quikit }}" = "true" ] && APPS+=('"quikit"')
      [ "${{ steps.filter.outputs.auth }}" = "true" ] && APPS+=('"auth"')
      [ "${{ steps.filter.outputs.admin }}" = "true" ] && APPS+=('"admin"')
      [ "${{ steps.filter.outputs.quikscale }}" = "true" ] && APPS+=('"quikscale"')
      [ "${{ steps.filter.outputs.quiktrack }}" = "true" ] && APPS+=('"quiktrack"')
      [ "${{ steps.filter.outputs.quikinfra }}" = "true" ] && APPS+=('"quikinfra"')
      [ "${{ steps.filter.outputs.quikcrm }}" = "true" ] && APPS+=('"quikcrm"')
      [ "${{ steps.filter.outputs.quikhrms }}" = "true" ] && APPS+=('"quikhrms"')

      if [ ${#APPS[@]} -eq 0 ]; then
        echo "apps=[]" >> "$GITHUB_OUTPUT"
        echo "run_build=false" >> "$GITHUB_OUTPUT"
      else
        MATRIX="[$(IFS=,; echo "${APPS[*]}")]"

        echo "apps=$MATRIX" >> "$GITHUB_OUTPUT"
        echo "run_build=true" >> "$GITHUB_OUTPUT"

        echo "Detected apps: $MATRIX"
      fi

  - name: Debug Matrix
    run: |
      echo "Apps: ${{ steps.set-matrix.outputs.apps }}"
      echo "Run Build: ${{ steps.set-matrix.outputs.run_build }}"
  build:
    name: Build ${{ matrix.app }}
    needs: detect-changes
    if: needs.detect-changes.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.app }}-runtime
          tags: |
            type=raw,value=build-${{ github.run_number }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          platforms: linux/amd64
          # NEXT_PUBLIC_* env vars used in CLIENT components get inlined
          # by webpack at `next build` time — runtime K8s env doesn't
          # override them. Pass real prod URLs as build-args so the
          # baked-in values match what Cloud Run / GKE pods serve.
          # These are safe to hardcode: they end up plain-text in every
          # browser bundle anyway.
          build-args: |
            NEXT_PUBLIC_LAUNCHER_URL=https://uatapps.quikit.ai
            NEXT_PUBLIC_AUTH_URL=https://uatauthn.quikit.ai
            NEXT_PUBLIC_QUIKIT_URL=https://uatapps.quikit.ai
            NEXT_PUBLIC_QUIKSCALE_URL=https://uatscale.quikit.ai
            NEXT_PUBLIC_ADMIN_URL=https://uatorgadmin.quikit.ai
            NEXT_PUBLIC_LOGIN_URL=https://uatauthn.quikit.ai/login
            NEXT_PUBLIC_QUIKINFRA_URL=https://uatinfra.quikit.ai
            NEXT_PUBLIC_QUIKCRM_URL=https://uatcrm.quikit.ai
            NEXTAUTH_URL=https://uatauthn.quikit.ai
