name: UAT-pipeline

on:
  push:
    branches:
      - UAT
  workflow_dispatch:

concurrency:
  group: UAT-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.set-matrix.outputs.apps }}
      run_build: ${{ steps.set-matrix.outputs.run_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before || github.sha }}
          filters: |
            shared:
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
            quikit:
              - 'apps/quikit/**'
            auth:
              - 'apps/auth/**'
            admin:
              - 'apps/admin/**'
            quikscale:
              - 'apps/quikscale/**'
            quiktrack:
              - 'apps/quiktrack/**'
            quikhrms:
              - 'apps/quikhrms/**'
            quikinfra:
              - 'apps/quikinfra/**'
            quikcrm:
              - 'apps/quikcrm/**'
            quiksupport:
              - 'apps/quiksupport/**'
            quikasset:
              - 'apps/quikasset/**'
            quikchat:
              - 'apps/quikchat/**'
            quiklms:
              - 'apps/quiklms/**'
            quikinsight:
              - 'apps/quikinsight/**'
            realtime:
              - 'services/realtime/**'
            quikcrmexpress:
              - 'apps/quikcrmexpress/**'

      - name: Generate matrix
        id: set-matrix
        shell: bash
        run: |
          APPS=()
          # NOTE: quikcrmexpress is intentionally NOT in this list yet. The
          # update-gitops step below maps each app to a deployment file in the
          # external GitOps repo and `exit 1`s on an unknown app. Add
          # "quikcrmexpress" here only together with its case branch in that
          # step, once the GitOps deployment filename is confirmed.
          ALL=(quikit auth admin quikscale quiktrack quikhrms quikinfra quikcrm quiksupport quikasset quikchat quiklms quikinsight realtime quikcrmexpress)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.filter.outputs.shared }}" = "true" ]; then
            APPS=("${ALL[@]}")
          else
            [ "${{ steps.filter.outputs.quikit }}" = "true" ] && APPS+=("quikit")
            [ "${{ steps.filter.outputs.auth }}" = "true" ] && APPS+=("auth")
            [ "${{ steps.filter.outputs.admin }}" = "true" ] && APPS+=("admin")
            [ "${{ steps.filter.outputs.quikscale }}" = "true" ] && APPS+=("quikscale")
            [ "${{ steps.filter.outputs.quiktrack }}" = "true" ] && APPS+=("quiktrack")
            [ "${{ steps.filter.outputs.quikhrms }}" = "true" ] && APPS+=("quikhrms")
            [ "${{ steps.filter.outputs.quikinfra }}" = "true" ] && APPS+=("quikinfra")
            [ "${{ steps.filter.outputs.quikcrm }}" = "true" ] && APPS+=("quikcrm")
            [ "${{ steps.filter.outputs.quiksupport }}" = "true" ] && APPS+=("quiksupport")
            [ "${{ steps.filter.outputs.quikasset }}" = "true" ] && APPS+=("quikasset")
            [ "${{ steps.filter.outputs.quikchat }}" = "true" ] && APPS+=("quikchat")
            [ "${{ steps.filter.outputs.quiklms }}" = "true" ] && APPS+=("quiklms")
            [ "${{ steps.filter.outputs.quikinsight }}" = "true" ] && APPS+=("quikinsight")
            [ "${{ steps.filter.outputs.quikcrmexpress }}" = "true" ] && APPS+=("quikcrmexpress")
            [ "${{ steps.filter.outputs.realtime }}" = "true" ] && APPS+=("realtime")
          fi

          echo "Selected apps: ${APPS[@]}"

          if [ ${#APPS[@]} -eq 0 ]; then
            echo "apps=[]" >> "$GITHUB_OUTPUT"
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${APPS[@]}" | jq -R . | jq -s -c .)
            echo "apps=$JSON" >> "$GITHUB_OUTPUT"
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.app }}
    needs: detect-changes
    if: needs.detect-changes.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-changes.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve Dockerfile path
        id: dockerfile
        shell: bash
        run: |
          # The realtime gateway is a service (not an app) — its Dockerfile
          # lives under services/, not apps/. Everything else follows apps/<app>/.
          if [ "${{ matrix.app }}" = "realtime" ]; then
            echo "path=services/realtime/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "path=apps/${{ matrix.app }}/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.app }}-runtime
          tags: |
            type=raw,value=build-${{ github.run_number }}
            type=sha,prefix=sha-,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_LAUNCHER_URL=https://uatapps.quikit.ai
            NEXT_PUBLIC_AUTH_URL=https://uatauthn.quikit.ai
            NEXT_PUBLIC_QUIKIT_URL=https://uatapps.quikit.ai
            NEXT_PUBLIC_QUIKSCALE_URL=https://uatscale.quikit.ai
            NEXT_PUBLIC_ADMIN_URL=https://uatorgadmin.quikit.ai
            NEXT_PUBLIC_LOGIN_URL=https://uatauthn.quikit.ai/login
            NEXT_PUBLIC_WEBSITE_URL=https://uat.quikit.ai
            NEXT_PUBLIC_QUIKINFRA_URL=https://uatinfra.quikit.ai
            NEXT_PUBLIC_QUIKCRM_URL=https://uatcrm.quikit.ai
            NEXT_PUBLIC_QUIKCRMEXPRESS_URL=https://uatcrmexpress.quikit.ai
            NEXT_PUBLIC_QUIKHRMS_URL=https://uatpeople.quikit.ai
            NEXT_PUBLIC_QUIKSUPPORT_URL=https://uatsupport.quikit.ai
            NEXT_PUBLIC_APP_URL=https://uatsupport.quikit.ai
            NEXTAUTH_URL=https://uatauthn.quikit.ai
            NEXT_PUBLIC_QUIKASSET_URL=https://uatasset.quikit.ai
            NEXT_PUBLIC_QUIKCHAT_URL=https://uatchat.quikit.ai
            NEXT_PUBLIC_QUIKLMS_URL=https://uatlms.quikit.ai
            NEXT_PUBLIC_REALTIME_WS_URL=wss://uatsockets.quikit.ai
            NEXT_PUBLIC_QUIKTRACK_URL=https://uattrack.quikit.ai
            NEXT_PUBLIC_QUIKCREDFLOW_URL=https://uatcrmexpress.quikit.ai
            NEXT_PUBLIC_QUIKINSIGHT_URL=https://uatinsights.quikit.ai
  update-gitops:
    name: Update GitOps Repository
    needs:
      - detect-changes
      - build
    if: needs.detect-changes.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: akhileshgandhi/uat-k8s-infra-quikit
          ref: main
          token: ${{ secrets.K8S_REPO_TOKEN }}
          path: gitops

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Update Deployment Images
        shell: bash
        run: |
          APPS='${{ needs.detect-changes.outputs.apps }}'
          TAG="sha-${GITHUB_SHA::7}"
          cd gitops/quikit
          echo "$APPS" | jq -r '.[]' | while read APP
          do
            case "$APP" in
              auth)
                FILE="auth-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/auth-runtime:${TAG}"
                ;;
              admin)
                FILE="admin-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/admin-runtime:${TAG}"
                ;;
              quikit)
                FILE="quikit-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/quikit-runtime:${TAG}"
                ;;
              quiktrack)
                FILE="quikittrack-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/quiktrack-runtime:${TAG}"
                ;;
              quikscale)
                FILE="quikitscale-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/quikscale-runtime:${TAG}"
                ;;
              quikinsight)
                FILE="insights-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/quikinsight-runtime:${TAG}"
                ;;
              quikinfra)
                FILE="quikitinfra-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/quikinfra-runtime:${TAG}"
                ;;
              quikcrm)
                FILE="crm-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/quikcrm-runtime:${TAG}"
                ;;
              quikhrms)
                FILE="hrms-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/quikhrms-runtime:${TAG}"
                ;;
              quiksupport)
                FILE="support-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/quiksupport-runtime:${TAG}"
                ;;
              quikasset)
                FILE="asset-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/quikasset-runtime:${TAG}"
                ;;
              quikchat)
                FILE="chat-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/quikchat-runtime:${TAG}"
                ;;
              quiklms)
                FILE="lms-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/quiklms-runtime:${TAG}"
                ;;
              quikcrmexpress)
                FILE="crmexpress-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/quikcrmexpress-runtime:${TAG}"
                ;;
              realtime)
                FILE="socket-deployment.yaml"
                IMAGE="ghcr.io/akhileshgandhi/realtime-runtime:${TAG}"
                ;;
              *)
                echo "Unknown app: $APP"
                exit 1
                ;;
            esac
            echo "Updating $FILE"
            export IMAGE
            yq -i '.spec.template.spec.containers[0].image = env(IMAGE)' "$FILE"
          done

      - name: Commit Changes
        shell: bash
        run: |
          cd gitops
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git diff --quiet
          then
            echo "No changes detected."
            exit 0
          fi
          git add .
          git commit -m "Update UAT images to sha-${GITHUB_SHA::7}"

      - name: Push Changes
        shell: bash
        run: |
          cd gitops
          git push origin main
