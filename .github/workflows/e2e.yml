name: E2E

# Playwright runs are expensive (build, browser install, DB seed). Keep them
# OFF of every PR and run nightly + on-demand instead. Unit/component tests
# cover the regression surface on PRs via ci.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quikscale_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quikscale_e2e
      NEXTAUTH_SECRET: e2e-secret-do-not-use-in-prod
      NEXTAUTH_URL: http://localhost:3004
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply Prisma schema
        run: npm run db:push
        working-directory: .

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/quikscale

      - name: Seed E2E tenant
        run: npm run db:seed:e2e

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: apps/quikscale

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/quikscale/playwright-report/
          retention-days: 7
