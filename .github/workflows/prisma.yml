name: Prisma — migrate deploy

on:
  workflow_dispatch:
  push:
    branches: [Pre-Prod]

permissions:
  contents: read

jobs:
  prisma-migrate:
    name: Prisma — migrate deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔐 1️⃣ Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 🚀 2️⃣ Start Cloud SQL Auth Proxy
      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.4/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy red-seeker-477810-i0:asia-south1:quikit-db \
            --port 5432 &
          sleep 5

      - name: Install dependencies (monorepo)
        run: npm ci

      # 🧱 3️⃣ Prisma migration (NO CHANGE)
      # 🧱 3️⃣ Prisma migration (with Self-Healing Auto-Resolve)
      - name: Prisma migrate deploy (PROD with Self-Healing)
        run: |
          node << 'EOF'
          const { execSync } = require("child_process");
          const { PrismaClient } = require("@prisma/client");
          const schemaPath = "packages/database/prisma/schema.prisma";

          async function runDeployWithAutoResolve() {
            const prisma = new PrismaClient({
              datasources: {
                db: {
                  url: process.env.DATABASE_URL_DIRECT || process.env.DATABASE_URL
                }
              }
            });

            const maxAttempts = 15;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              console.log(`\n=============================================`);
              console.log(`   Migration Deploy Attempt ${attempt} / ${maxAttempts}`);
              console.log(`=============================================`);
              
              let deployStdout = "";
              let deployFailed = false;
              try {
                deployStdout = execSync("npx prisma migrate deploy --schema=" + schemaPath + " 2>&1").toString();
                console.log(deployStdout);
                console.log("Migration deployment completed successfully!");
                await prisma.$disconnect();
                return; // Exit script successfully
              } catch (deployError) {
                deployFailed = true;
                deployStdout = (deployError.stdout || "").toString() + (deployError.stderr || "").toString() + deployError.toString();
                console.log("Deploy output:\n", deployStdout);
              }

              if (deployFailed) {
                // Check if the error is due to pre-existing tables/relations OR a P3009 blocked state
                const isAlreadyExistsError = deployStdout.includes("already exists") 
                                          || deployStdout.includes("SqlState(E42P07)")
                                          || deployStdout.includes("SqlState(E42701)")
                                          || deployStdout.includes("P3009")
                                          || deployStdout.includes("failed migrations in the target database");

                if (!isAlreadyExistsError) {
                  console.error("Migration failed with a critical error (not 'already exists'). Aborting.");
                  process.exit(1);
                }

                console.log("Detected 'already exists' database conflict. Auto-resolving failed migration as applied...");
                
                try {
                  const failedMigrations = await prisma.$queryRawUnsafe(
                    "SELECT id, migration_name FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL"
                  );
                  console.log("Failed migrations in database:", failedMigrations);
                  
                  if (failedMigrations.length === 0) {
                    // Fallback to logs if database metadata hasn't caught up
                    const match = deployStdout.match(/Migration name: ([0-9a-zA-Z_-]+)/i)
                               || deployStdout.match(/The [`'\"]?([0-9a-zA-Z_-]+)[`'\"]? migration started at.*failed/i)
                               || deployStdout.match(/Applying migration [`'\"]?([0-9a-zA-Z_-]+)[`'\"]?/i);
                    if (match && match[1]) {
                      const failedMigration = match[1];
                      console.log(`Found failed migration from logs: ${failedMigration}. Resolving via CLI...`);
                      execSync(`npx prisma migrate resolve --applied ${failedMigration} --schema=${schemaPath}`, { stdio: "inherit" });
                    } else {
                      console.error("Could not determine which migration failed. Aborting.");
                      process.exit(1);
                    }
                  } else {
                    for (const m of failedMigrations) {
                      console.log(`Marking migration ${m.migration_name} as applied in DB...`);
                      await prisma.$executeRawUnsafe(
                        "UPDATE _prisma_migrations SET finished_at = NOW() WHERE id = $1",
                        m.id
                      );
                      console.log(`Successfully resolved migration: ${m.migration_name}`);
                    }
                  }
                } catch (err) {
                  console.error("Failed during auto-resolution step:", err.message);
                  process.exit(1);
                }
              }
            }

            console.error(`Reached maximum deploy attempts (${maxAttempts}). Migration loop terminated.`);
            process.exit(1);
          }

          runDeployWithAutoResolve().catch(err => {
            console.error("Fatal error:", err);
            process.exit(1);
          });
          EOF
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.PROD_DATABASE_URL }}

      - name: Verify migration status
        run: |
          npx prisma migrate status \
            --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
