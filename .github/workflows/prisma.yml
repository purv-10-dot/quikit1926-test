name: Prisma — migrate deploy

on:
  workflow_dispatch:
  push:
    branches: [Pre-Prod]

permissions:
  contents: read

jobs:
  prisma-migrate:
    name: Prisma — migrate deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔐 1️⃣ Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 🚀 2️⃣ Start Cloud SQL Auth Proxy
      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.11.4/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy red-seeker-477810-i0:asia-south1:quikit-db \
            --port 5432 &
          sleep 5

      - name: Install dependencies (monorepo)
        run: npm ci

      # 🧱 3️⃣ Prisma migration (NO CHANGE)
      - name: Auto-resolve any failed database migrations
        run: |
          node << 'EOF'
          const { execSync } = require("child_process");
          const schemaPath = "packages/database/prisma/schema.prisma";
          let output = "";
          try {
            console.log("Checking database migration status...");
            output = execSync("npx prisma migrate status --schema=" + schemaPath).toString();
          } catch (error) {
            output = (error.stdout || "").toString() + (error.stderr || "").toString() + error.toString();
          }
          console.log("Migration status output:\n", output);
          
          const match = output.match(/The [`'"]?([0-9a-zA-Z_-]+)[`'"]? migration started at.*failed/i)
                     || output.match(/migration ([0-9a-zA-Z_-]+) .*failed/i);
                     
          if (match && match[1]) {
            const failedMigration = match[1];
            console.log("Detected failed migration:", failedMigration);
            console.log("Attempting to auto-resolve it as applied...");
            try {
              execSync("npx prisma migrate resolve --applied " + failedMigration + " --schema=" + schemaPath, { stdio: "inherit" });
              console.log("Successfully resolved migration:", failedMigration);
            } catch (resolveError) {
              console.error("Failed to run resolve command:", resolveError.message);
              process.exit(1);
            }
          } else {
            console.log("No failed migrations identified to resolve.");
          }
          EOF
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.PROD_DATABASE_URL }}

      - name: Prisma migrate deploy (PROD)
        run: |
          npx prisma migrate deploy \
            --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.PROD_DATABASE_URL }}

      - name: Verify migration status
        run: |
          npx prisma migrate status \
            --schema=packages/database/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
