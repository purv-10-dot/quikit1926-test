# docker-compose for local/staging QuikConstruction stack.
# Run: docker compose -f apps/quikconstruction/docker-compose.yml up
# Override secrets via an adjacent .env file (not committed).

version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quikconstruction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: quikconstruction
    volumes:
      - quikconstruction-db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quikconstruction"]
      interval: 10s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: apps/quikconstruction/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://quikconstruction:${POSTGRES_PASSWORD:-change-me}@db:5432/quikconstruction
      DATABASE_URL_DIRECT: postgresql://quikconstruction:${POSTGRES_PASSWORD:-change-me}@db:5432/quikconstruction
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3007}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-in-production}
      QUIKIT_URL: ${QUIKIT_URL:-http://quikit:3000}
      NEXT_PUBLIC_QUIKIT_URL: ${NEXT_PUBLIC_QUIKIT_URL:-http://localhost:3000}
      QUIKIT_CLIENT_ID: ${QUIKIT_CLIENT_ID:-quikconstruction}
      QUIKIT_CLIENT_SECRET: ${QUIKIT_CLIENT_SECRET:-change-me}
      QC_DOCS_ROOT: /app/uploads
      NODE_ENV: production
    ports:
      - "3007:3007"
    volumes:
      - quikconstruction-uploads:/app/uploads

volumes:
  quikconstruction-db:
  quikconstruction-uploads:
