  "/api/store/stock-reconciliation/{id}/post":
    post:
      operationId: quikinfraPostStoreStockReconciliationIdPost
      summary: "Reconciliation post: writes adjustment rows."
      description: |-
        Reconciliation post: writes adjustment rows.
        adjustmentQty > 0 → extra found → qtyIn row
        adjustmentQty < 0 → shortage    → qtyOut row (absolute value)
        adjustmentQty = 0 → skip (no ledger row needed)
        transactionType = "reconciliation_adj".
      tags:
        - "app:quikinfra"
        - "quikinfra:store"
      x-source-file: "apps/quikinfra/app/api/store/stock-reconciliation/[id]/post/route.ts"
