openapi: 3.0.3
info:
  title: "QuikIT Platform API"
  version: "0.1.0"
  description: |
    Auto-generated OpenAPI 3.0 spec covering ALL 5 QuikIT apps:
    quikit (launcher + super-admin), quikscale, admin, quikvc, quikinfra.

    **Filter by tag** in the Swagger UI sidebar to scope to a single app
    (`app:quikscale`) or a single module (`kpi`, `opsp`, etc.).

    **Tier 1 spec** — request/response shapes use a generic
    `{ success, data }` envelope. Per-route Zod-derived schemas are not
    yet extracted. See _internal/api-contract-tools/build_openapi_spec.py.

    Generated: 2026-04-29

  contact:
    name: "QuikIT Platform Team"

# servers: injected at runtime by app/api/docs/spec/route.ts from env vars
# (QUIKIT_URL, QUIKSCALE_URL, ADMIN_URL, QUIKVC_URL, QUIKINFRA_URL).
# Local dev uses http://localhost:* via .env.local; prod uses Vercel env.
servers: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: "NextAuth session cookie. Set after SSO via /login."

  schemas:
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          description: "Endpoint-specific payload. See route source for details."
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string

security:
  - sessionCookie: []

