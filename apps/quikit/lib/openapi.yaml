      operationId: quikitPostAppsEnable
      summary: "Enables an app for the current org. Creates UserAppAccess records"
      description: |-
        POST /api/apps/enable
        
        Enables an app for the current org. Creates UserAppAccess records
        for ALL active members of the tenant (so everyone can see the app
        in their launcher). Admin-only.
        
        Body: { appId: string }
      tags:
        - "app:quikit"
        - "quikit:apps"
      x-source-file: "apps/quikit/app/api/apps/enable/route.ts"
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '201':
          description: "Created"
