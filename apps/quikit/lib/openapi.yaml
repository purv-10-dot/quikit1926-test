  "/api/auth/impersonate/{token}":
    get:
      operationId: quikscaleGetAuthImpersonateToken
      summary: "SA-D.3 — Impersonation accept endpoint (QuikScale side)."
      description: |-
        SA-D.3 — Impersonation accept endpoint (QuikScale side).
        
        GET /api/auth/impersonate/:token
        
        Called by the super admin's browser (redirect from the launcher's start
        endpoint). Validates the one-time token, creates a NextAuth session as the
        target user with impersonation flags set, and redirects to the landing
        path on success.
        
        Security model:
        - Token is single-use; accepting it sets Impersonation.acceptedAt.
        Replay attempts return 410 Gone.
        - Token expires after 2h (hard deadline in the DB row).
        - Session cookie inherits the Impersonation's expiresAt, so even if the
        super admin doesn't explicitly exit, the session dies at the deadline.
        - A SessionEvent ("impersonation_start") is recorded so analytics
        distinguish real user activity from customer-support activity.
        
        Config requirement: NEXTAUTH_SECRET must be the SAME across quikit and
        quikscale (they already share it for the OAuth flow).
      tags:
        - "app:quikscale"
        - "quikscale:auth"
      x-source-file: "apps/quikscale/app/api/auth/impersonate/[token]/route.ts"
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: "Unauthenticated"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "Forbidden"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Server error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  "/api/auth/impersonate/exit":
    post:
      operationId: quikscalePostAuthImpersonateExit
      summary: "SA-D.5 — Exit impersonation."
      description: |-
        SA-D.5 — Exit impersonation.
        
        POST /api/auth/impersonate/exit
        
        Records a SessionEvent, stamps Impersonation.exitedAt if we can match it,
        clears the session cookie, and redirects back to the QuikIT launcher so
        the super admin is in their own session again.
      tags:
        - "app:quikscale"
