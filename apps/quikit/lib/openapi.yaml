                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: "Server error"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      operationId: quikinfraPostHrmsPayroll
      summary: "Algorithm (per employee):"
      description: |-
