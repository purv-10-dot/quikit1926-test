<!--
  Upwork panel body, injected into #htmlContainer by popup.js.

  UI ONLY. Every id, and every class the JS toggles at runtime, is unchanged:
    #upworkdata      — popup.js/upwork.js toggle .hidden / .block on it
    #fetchsection / #fetchData / #fetchDatatext / #fetchDataloader
    #intialdata, #output, #save
    #jobTitle #projectType #SkillsandExpertise #clientLocation #proposals
    #reviews #projectprice #projectTime #ConnectsValue #jobDescription
    #AI, #alo        — AI results panel

  Layout: one field per row, single vertical column (no grid). Each field is a
  .field shell (border + rounded corners) wrapping a green leading icon and a
  borderless control, so every row shares one height and one border treatment.
-->
<div class="block" id="upworkdata">
  <!-- Header + Logout. The real #logOut button lives in popup.html and is moved
       into this slot at runtime, so there is exactly one logout control. -->
  <div class="qf-header-row">
    <div>
      <h2 class="qf-title">Upwork CRM</h2>
      <p class="qf-subtitle">Extract and save Upwork job information</p>
    </div>
    <span id="logoutSlot"></span>
  </div>

  <!-- Primary action. Extraction runs only when the user clicks. -->
  <div id="fetchsection" class="fetch-section">
    <button id="fetchData" type="button">
      <span id="fetchDatatext">Extract Job Data</span>
    </button>
  </div>

  <!-- AFTER EXTRACTION: revealed by the fetchData handler. -->
  <div id="intialdata" style="display: none;">
    <form id="output">
      <div class="form-grid">
        <!-- 1. Job Title -->
        <div class="form-group">
          <label class="form-label" for="jobTitle">Job Title</label>
          <div class="field">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" />
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
              </svg>
            </span>
            <input type="text" class="form-input" id="jobTitle" placeholder="Job title" />
          </div>
        </div>

        <!-- 2. Project Type -->
        <div class="form-group">
          <label class="form-label" for="projectType">Project Type</label>
          <div class="field">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <path d="M14 2v6h6" />
              </svg>
            </span>
            <input type="text" class="form-input" id="projectType" placeholder="Project type" />
          </div>
        </div>

        <!-- 3. Skills -->
        <div class="form-group">
          <label class="form-label" for="SkillsandExpertise">Skills</label>
          <div class="field">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.6 13.4 12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 2.8z" />
                <circle cx="7.5" cy="7.5" r="1.2" />
              </svg>
            </span>
            <input type="text" class="form-input" id="SkillsandExpertise" placeholder="Skills" />
          </div>
        </div>

        <!-- 4. Location -->
        <div class="form-group">
          <label class="form-label" for="clientLocation">Location</label>
          <div class="field">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" />
                <circle cx="12" cy="10" r="3" />
              </svg>
            </span>
            <input type="text" class="form-input" id="clientLocation" placeholder="Client location" />
          </div>
        </div>

        <!-- 5. Proposals -->
        <div class="form-group">
          <label class="form-label" for="proposals">Proposals</label>
          <div class="field">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
            </span>
            <input type="text" class="form-input" id="proposals" placeholder="Proposals" />
          </div>
        </div>

        <!-- 6. Reviews -->
        <div class="form-group">
          <label class="form-label" for="reviews">Reviews</label>
          <div class="field">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z" />
              </svg>
            </span>
            <input type="text" class="form-input" id="reviews" placeholder="Reviews" />
          </div>
        </div>

        <!-- 7. Project Price -->
        <div class="form-group">
          <label class="form-label" for="projectprice">Project Price</label>
          <div class="field">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M14.8 9.3a2.6 2.6 0 0 0-2.4-1.3h-.6a2.2 2.2 0 0 0-.3 4.4h1a2.2 2.2 0 0 1-.3 4.4h-.6a2.6 2.6 0 0 1-2.4-1.3" />
                <path d="M12 6.5v11" />
              </svg>
            </span>
            <input type="text" class="form-input" id="projectprice" placeholder="Project price" />
          </div>
        </div>

        <!-- 8. Project Time -->
        <div class="form-group">
          <label class="form-label" for="projectTime">Project Time</label>
          <div class="field">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" />
              </svg>
            </span>
            <input type="text" class="form-input" id="projectTime" placeholder="Duration" />
          </div>
        </div>

        <!-- 9. Required Connects -->
        <div class="form-group">
          <label class="form-label" for="ConnectsValue">Required Connects</label>
          <div class="field">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" />
                <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" />
              </svg>
            </span>
            <input class="form-input" id="ConnectsValue" placeholder="Connects" />
          </div>
        </div>

        <!-- 10. Description — taller multiline container. -->
        <div class="form-group">
          <label class="form-label" for="jobDescription">Description</label>
          <div class="field field-textarea">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 6h16" />
                <path d="M4 12h16" />
                <path d="M4 18h10" />
              </svg>
            </span>
            <textarea class="form-input form-textarea" id="jobDescription" rows="6"
              placeholder="Job description"></textarea>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="save-button" id="save">Add to CRM</button>
      </div>
    </form>
  </div>

  <!-- Loader overlay. JS toggles .hidden / .block. -->
  <div id="fetchDataloader" class="hidden"
    style="position: fixed; inset: 0; background: rgba(15, 23, 36, 0.35); display: flex; justify-content: center; align-items: center; z-index: 50;">
    <img src="./assets/loader0.gif" style="width: 56px; height: 56px;" alt="Loading…" />
  </div>
</div>

<!-- AI results panel. Populated by upwork.js; shown via .visible (showAiPanel). -->
<div class="hidden" id="AI">
  <div id="alo"></div>
</div>
