<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn CRM Extension</title>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      min-width: 280px; 
      max-width: 360px;
      padding: 20px; 
      margin: 0;
      background: #f5f5f5;
    }
    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .logo {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 16px;
      color: #0077b5;
      text-align: center;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-primary {
      background-color: #0077b5;
      color: white;
    }
    .btn-primary:hover {
      background-color: #005885;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">LinkedIn CRM Extension</div>
    <button id="openSidePanelBtn" class="btn btn-primary">
      Open LinkedIn CRM
    </button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
